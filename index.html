<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dixit Therapy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
            letter-spacing: 2px;
            margin-bottom: 16px;
            transition: border 0.2s;
        }
        input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0;
        }
        input[type="password"]:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.25);
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: white;
            color: #764ba2;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover { opacity: 0.92; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        .error {
            color: #fca5a5;
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .error.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🃏 Dixit Therapy</h1>
        <p class="subtitle">Inserisci la password per accedere</p>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="password" id="pwd" placeholder="Password" autofocus autocomplete="current-password">
            <button type="submit">Accedi</button>
            <p class="error" id="err">Password non corretta.</p>
        </form>
    </div>
    <script>
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                || window.innerWidth < 768;
        }

        function redirect() {
            const dest = isMobile() ? '/dixit-therapy/mobile.html' : '/dixit-therapy/desktop.html';
            window.location.replace(dest);
        }

        // Già autenticato in questa sessione? Vai direttamente all'app
        if (sessionStorage.getItem('dixit_auth') === 'ok') {
            redirect();
        }

        function handleLogin(e) {
            e.preventDefault();
            const val = document.getElementById('pwd').value;
            if (val === 'dixit@2026') {
                sessionStorage.setItem('dixit_auth', 'ok');
                redirect();
            } else {
                const err = document.getElementById('err');
                err.classList.add('show');
                document.getElementById('pwd').value = '';
                document.getElementById('pwd').focus();
            }
        }
    </script>
</body>
</html>
